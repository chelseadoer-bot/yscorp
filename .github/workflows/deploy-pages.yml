name: Deploy to GitHub Pages

# web/ 폴더(정적 사이트)를 GitHub Pages로 배포한다.
# 최초 1회: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 설정.
# 이후 코드가 바뀌어 push 될 때마다 자동으로 최신 사이트가 배포된다.

on:
  push:
    branches:
      - "claude/purchase-order-format-integration-an56r6"
      - main
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages가 꺼져 있으면 워크플로가 자동으로 켠다(수동 설정 불필요)

      - name: Upload site (web/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
